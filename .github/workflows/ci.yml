name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cohive
          POSTGRES_PASSWORD: cohive
          POSTGRES_DB: cohive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Dependency audit (fails on any vulnerability)
        run: npm audit --audit-level=low

      - name: Typecheck + production build
        run: npm run build

      - name: Engine property checks (46)
        run: npm run verify:engine

      - name: API auth, ACL, sanitize, rate limits, hives (40)
        run: npm run verify:api

      - name: Postgres store — auth, invites, money concurrency, durability, hives (15)
        run: npm run verify:pg
        env:
          DATABASE_URL: postgres://cohive:cohive@127.0.0.1:5432/cohive_test

      - name: Engine stress + fuzz (seeded)
        run: npm run stress:engine

      - name: Install Playwright Chromium + WebKit
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit

      - name: Browser walkthrough (77 checks)
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://127.0.0.1:4173 --timeout 30000 2>/dev/null \
            || for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          npm run smoke -- http://127.0.0.1:4173

      - name: Payments end-to-end on WebKit / iPhone viewport (21 checks)
        run: npm run e2e:payments -- http://127.0.0.1:4173

      - name: Browser stress + endurance (13 checks)
        run: npm run stress -- http://127.0.0.1:4173

      - name: Accessibility audit (axe, all screens, both themes)
        run: npm run a11y -- http://127.0.0.1:4173

      - name: Capacitor sync sanity
        run: npx cap sync

  ios:
    # Real iOS toolchain: CocoaPods resolves the Capacitor pods and Xcode
    # compiles the app for the simulator (no signing) — the check the Linux
    # job cannot do.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Capacitor sync iOS (runs pod install)
        run: npx cap sync ios

      - name: Xcode build for iOS Simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
